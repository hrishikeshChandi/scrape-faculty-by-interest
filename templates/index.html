<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Trial</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Edu+AU+VIC+WA+NT+Pre:wght@400..700&display=swap"
      rel="stylesheet"
    />
    <style>
      body {
        font-family: "Edu AU VIC WA NT Pre", sans-serif;
        line-height: 1.6;
        margin: 0;
        padding: 0;
        background: linear-gradient(135deg, #0f2027, #203a43, #2c5364);
        background-size: 400% 400%;
        animation: gradientBG 15s ease infinite;
        color: #f0f0f0;
        min-height: 100vh;
        display: flex;
        justify-content: center;
        align-items: center;
        padding: 20px;
      }

      @keyframes gradientBG {
        0% {
          background-position: 0% 50%;
        }
        50% {
          background-position: 100% 50%;
        }
        100% {
          background-position: 0% 50%;
        }
      }

      .container-wrapper {
        display: flex;
        gap: 20px;
        max-width: 1200px;
        width: 100%;
      }

      .container {
        flex: 1;
        background-color: #1b2838;
        padding: 20px;
        border-radius: 12px;
        box-shadow: 0 4px 15px rgba(0, 0, 0, 0.4);
        animation: fadeIn 1.5s ease;
      }

      @keyframes fadeIn {
        from {
          opacity: 0;
          transform: translateY(10px);
        }
        to {
          opacity: 1;
          transform: translateY(0);
        }
      }

      form {
        margin-bottom: 20px;
      }

      label {
        font-weight: bold;
        display: block;
        margin-bottom: 10px;
      }

      select,
      button,
      textarea {
        font-family: "Edu AU VIC WA NT Pre", sans-serif;
        font-size: 1rem;
        padding: 10px;
        margin: 5px 0;
        border: 1px solid #555;
        border-radius: 6px;
        width: 100%;
        box-sizing: border-box;
        transition: all 0.3s ease;
      }

      select {
        background-color: #16242e;
        color: #f0f0f0;
      }

      select:hover {
        background-color: #1b2838;
      }

      button {
        background: linear-gradient(135deg, #0061a8, #0082c8);
        color: #fff;
        font-weight: bold;
        cursor: pointer;
        border: none;
        transition: all 0.3s ease;
      }

      button:hover {
        background: linear-gradient(135deg, #0082c8, #0061a8);
        transform: translateY(-2px);
        box-shadow: 0 4px 10px rgba(0, 97, 168, 0.4);
      }

      textarea {
        background-color: #16242e;
        color: #f0f0f0;
        resize: none;
        border: 1px solid #444;
      }

      textarea:hover {
        border-color: #0082c8;
      }

      .results {
        background-color: #16242e;
        padding: 20px;
        border: 1px solid #444;
        border-radius: 6px;
        animation: fadeIn 1.5s ease;
      }

      button[type="reset"] {
        background: linear-gradient(135deg, #003973, #004d99);
        color: #fff;
        font-weight: bold;
        cursor: pointer;
        border: none;
        transition: all 0.3s ease;
        margin-top: 10px;
        width: 100%;
      }

      button[type="reset"]:hover {
        background: linear-gradient(135deg, #004d99, #003973);
        transform: translateY(-2px);
        box-shadow: 0 4px 10px rgba(0, 57, 115, 0.4);
      }
    </style>
  </head>
  <body>
    <div class="container-wrapper">
      <div class="container">
        <form action="/search_dept" method="POST">
          <label for="dept_s">Select a department:</label>
          <select name="dept_s" id="dept_s" required>
            {% for value in available_dept_s %}
            <option value="{{ value }}">{{ value }}</option>
            {% endfor %}
          </select>
          <button type="submit" id="search">Search Department</button>
        </form>

        {% if areas %}
        <form action="/submit" method="POST">
          <input type="hidden" name="dept_s" value="{{ dept }}" />
          <label for="domains">Select Area of Interest: ( {{ dept }} )</label>
          <select id="domains" name="domains" required>
            {% for area in areas %}
            <option value="{{ area }}">{{ area }}</option>
            {% endfor %}
          </select>
          <button type="submit">Submit</button>
        </form>
        {% endif %}
      </div>

      {% if results %}
      <div class="container">
        <div class="results">
          <label>Results:</label>
          <textarea cols="20" rows="7" readonly>
          {{ user_interest }}
          {% for x in results %}
          {{ loop.index }}.     {{ x }}
          {% endfor %}
        </textarea
          >
        </div>
        <button type="reset" onclick="window.location.href='/';">Reset</button>
      </div>
      {% endif %}
    </div>
  </body>
</html>
